name: Validate currently-reading books

# data/currently-reading.json is maintained by hand: the Goodreads shelf RSS
# feed this used to fetch has returned 404 since 2026-10-27. This only checks
# the file so a bad edit fails CI instead of breaking the site.
on:
  push:
    branches: [main]
    paths:
      - data/currently-reading.json
      - scripts/validate-currently-reading.js
      - .github/workflows/update-goodreads.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate data/currently-reading.json
        run: node scripts/validate-currently-reading.js
