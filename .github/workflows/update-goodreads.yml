name: Update currently-reading books

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours — reading shelf changes rarely
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch currently-reading shelf
        run: node scripts/fetch-goodreads.js

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/currently-reading.json
          git diff --cached --quiet || git commit -m "chore: update currently-reading books"
          git push
