name: Update currently-listening podcast

on:
  schedule:
    # GitHub Actions cron always runs in UTC and doesn't shift for DST, so
    # each window below is padded an extra hour on both ends to fully cover
    # 8-10am and 5-8pm Pacific across both PST (UTC-8) and PDT (UTC-7)
    # without needing manual edits twice a year.
    - cron: "*/10 15-18 * * *" # ~7-11am Pacific
    - cron: "*/10 0-4 * * *" # ~4-9pm Pacific (UTC crosses midnight)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Fetch latest podcast episode
        env:
          # Client ID is a public identifier, safe to commit — only the
          # secret and refresh token are sensitive and live in repo secrets.
          SPOTIFY_CLIENT_ID: "8ddbb71d13f34d2c80369da4734cff86"
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: node scripts/fetch-latest-podcast.js

      - name: Commit updated data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/currently-listening.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: update currently-listening podcast"
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Pushes made with GITHUB_TOKEN don't trigger other workflows, so the
  # deploy has to be called explicitly rather than relying on deploy.yml's
  # push trigger.
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      scope: data
