name: Update currently-listening podcast

on:
  schedule:
    # Hourly. GitHub delays and drops scheduled runs under load (in practice
    # only ~2 of the 18 runs a day the old listening-window crons asked for
    # ever ran), so timing can't be targeted. Podcasts no longer depend on it:
    # episode progress is compared between runs. Minute 17 avoids the top of
    # the hour, which GitHub documents as a high-load time for schedules.
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Runs one at a time so two runs never compare against the same saved
# episode positions.
concurrency:
  group: update-spotify
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Fetch latest music and podcast episode
        env:
          # Client ID is a public identifier, safe to commit — only the
          # secret and refresh token are sensitive and live in repo secrets.
          SPOTIFY_CLIENT_ID: "8ddbb71d13f34d2c80369da4734cff86"
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: node scripts/fetch-latest-podcast.js

      - name: Commit updated data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/currently-listening.json state/spotify-episode-positions.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Only a change to the site data needs a deploy; saved episode
          # positions alone (state/) are committed but not deployed.
          if git diff --cached --quiet -- data/; then changed=false; else changed=true; fi
          git commit -m "chore: update currently-listening data"
          git pull --rebase origin main
          git push
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  # Pushes made with GITHUB_TOKEN don't trigger other workflows, so the
  # deploy has to be called explicitly rather than relying on deploy.yml's
  # push trigger.
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      scope: data
