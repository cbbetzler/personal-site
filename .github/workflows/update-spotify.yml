name: Update currently-listening podcast

on:
  schedule:
    - cron: "0 * * * *" # hourly
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest podcast episode
        env:
          # Client ID is a public identifier, safe to commit — only the
          # secret and refresh token are sensitive and live in repo secrets.
          SPOTIFY_CLIENT_ID: "8ddbb71d13f34d2c80369da4734cff86"
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: node scripts/fetch-latest-podcast.js

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/currently-listening.json
          git diff --cached --quiet || git commit -m "chore: update currently-listening podcast"
          git push
