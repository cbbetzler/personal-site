name: Update currently-listening podcast

on:
  schedule:
    # GitHub Actions cron always runs in UTC and doesn't shift for DST, so
    # each window below is padded an extra hour on both ends to fully cover
    # 8-10am and 5-8pm Pacific across both PST (UTC-8) and PDT (UTC-7)
    # without needing manual edits twice a year.
    - cron: "*/10 15-18 * * *" # ~7-11am Pacific
    - cron: "*/10 0-4 * * *" # ~4-9pm Pacific (UTC crosses midnight)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest podcast episode
        env:
          # Client ID is a public identifier, safe to commit — only the
          # secret and refresh token are sensitive and live in repo secrets.
          SPOTIFY_CLIENT_ID: "8ddbb71d13f34d2c80369da4734cff86"
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: node scripts/fetch-latest-podcast.js

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/currently-listening.json
          git diff --cached --quiet || git commit -m "chore: update currently-listening podcast"
          git push
